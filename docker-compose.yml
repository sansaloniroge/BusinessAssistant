services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: businessassistant-postgres
    environment:
      # POSTGRES_USER es el rol bootstrap (superuser) que crea la imagen oficial de
      # Postgres; se usa solo para migraciones/admin (ver ALEMBIC_DATABASE_URL).
      # APP_DB_USER/APP_DB_PASSWORD son para el rol de runtime de mínimo privilegio
      # (no superuser, no bypassrls) que crea alembic/versions/0005_app_runtime_role.py
      # — necesario para que las políticas RLS se apliquen de verdad: un superuser
      # las ignora siempre, sin importar ENABLE/FORCE ROW LEVEL SECURITY.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-businessassistant}
      APP_DB_USER: ${APP_DB_USER:-app_runtime}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_runtime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: businessassistant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
